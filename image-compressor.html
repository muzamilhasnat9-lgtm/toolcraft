<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover">
    <title>Image Compressor – Free Online Tool | ToolCraft</title>
    <meta name="description" content="Compress images online for free. Drag & drop, adjust quality, preview before/after, and download instantly. No upload, private & fast.">
    <meta name="keywords" content="image compressor, compress image, reduce image size, jpg compressor, png compressor, webp compressor, free online tool">
    <meta name="author" content="ToolCraft">
    <meta name="robots" content="index, follow">

    <!-- Google Fonts & Font Awesome (same as main site) -->
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500;600;700;800;900&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.1/css/all.min.css">

    <style>
        /* ----- ToolCraft Design System (extracted from main styles.css) ----- */
        :root {
            --primary: #2563eb;
            --primary-hover: #1d4ed8;
            --primary-light: #dbeafe;
            --bg: #ffffff;
            --surface: #f8fafc;
            --text: #0f172a;
            --text-secondary: #475569;
            --border: #e2e8f0;
            --radius-md: 16px;
            --radius-lg: 22px;
            --shadow-sm: 0 2px 8px rgba(0,0,0,0.05);
            --shadow-md: 0 6px 20px rgba(0,0,0,0.07);
            --glass-bg: rgba(255,255,255,0.65);
            --glass-border: rgba(255,255,255,0.5);
            --glass-blur: blur(14px);
            --transition: 0.25s cubic-bezier(0.2, 0.0, 0, 1.0);
        }

        * { margin: 0; padding: 0; box-sizing: border-box; }
        body {
            font-family: 'Inter', sans-serif;
            background: linear-gradient(145deg, #f9fafc 0%, #f1f5f9 100%);
            color: var(--text);
            min-height: 100vh;
            display: flex;
            flex-direction: column;
            -webkit-font-smoothing: antialiased;
        }

        /* ----- Header (simple back navigation) ----- */
        .tool-header {
            background: var(--glass-bg);
            backdrop-filter: var(--glass-blur);
            -webkit-backdrop-filter: var(--glass-blur);
            border-bottom: 1px solid var(--glass-border);
            padding: 1rem 0;
            position: sticky;
            top: 0;
            z-index: 100;
        }
        .header-container {
            max-width: 1150px;
            margin: 0 auto;
            padding: 0 2rem;
            display: flex;
            align-items: center;
            justify-content: space-between;
        }
        .back-link {
            display: inline-flex;
            align-items: center;
            gap: 0.4rem;
            font-weight: 600;
            color: var(--primary);
            text-decoration: none;
            font-size: 0.95rem;
            transition: gap 0.2s;
        }
        .back-link:hover { gap: 0.7rem; }
        .back-link i { font-size: 0.9rem; }

        .site-logo {
            display: flex;
            align-items: center;
            gap: 0.5rem;
            font-weight: 800;
            font-size: 1.3rem;
            color: var(--text);
            text-decoration: none;
        }
        .site-logo i { color: var(--primary); }

        /* ----- Main Compressor Card ----- */
        .main-container {
            flex: 1;
            display: flex;
            align-items: center;
            justify-content: center;
            padding: 2rem;
        }
        .compressor-card {
            width: 100%;
            max-width: 850px;
            background: var(--bg);
            backdrop-filter: blur(10px);
            border-radius: var(--radius-lg);
            box-shadow: 0 16px 40px rgba(0,0,0,0.08), 0 0 0 1px rgba(0,0,0,0.02);
            padding: 2.5rem;
            display: flex;
            flex-direction: column;
            gap: 2rem;
        }

        /* ----- Upload Area (Drag & Drop) ----- */
        .upload-area {
            border: 2px dashed var(--border);
            border-radius: var(--radius-md);
            padding: 2.5rem 1.5rem;
            text-align: center;
            cursor: pointer;
            background: var(--surface);
            transition: all 0.2s ease;
            position: relative;
        }
        .upload-area:hover,
        .upload-area.dragover {
            border-color: var(--primary);
            background: var(--primary-light);
            transform: translateY(-1px);
        }
        .upload-area .upload-icon {
            font-size: 2.8rem;
            color: var(--primary);
            margin-bottom: 0.8rem;
            display: block;
        }
        .upload-text {
            font-weight: 600;
            font-size: 1.1rem;
            color: var(--text);
            margin-bottom: 0.3rem;
        }
        .upload-hint {
            color: var(--text-secondary);
            font-size: 0.9rem;
        }
        .upload-area input[type="file"] {
            position: absolute;
            inset: 0;
            opacity: 0;
            cursor: pointer;
        }

        /* ----- Preview & Details (hidden initially) ----- */
        .preview-section {
            display: flex;
            flex-wrap: wrap;
            gap: 1.5rem;
            background: var(--surface);
            border-radius: var(--radius-md);
            padding: 1.5rem;
            border: 1px solid var(--border);
            align-items: center;
        }
        .preview-box {
            flex: 1;
            min-width: 150px;
            max-width: 200px;
            aspect-ratio: 1 / 1;
            background: white;
            border-radius: var(--radius-md);
            display: flex;
            align-items: center;
            justify-content: center;
            overflow: hidden;
            border: 1px solid var(--border);
            box-shadow: var(--shadow-sm);
            position: relative;
        }
        .preview-box img {
            max-width: 100%;
            max-height: 100%;
            object-fit: contain;
        }
        .preview-label {
            position: absolute;
            top: 0.5rem;
            left: 0.5rem;
            background: rgba(0,0,0,0.6);
            color: white;
            font-size: 0.7rem;
            padding: 0.2rem 0.6rem;
            border-radius: 50px;
            font-weight: 600;
        }
        .image-details {
            flex: 2;
            display: flex;
            flex-direction: column;
            gap: 0.8rem;
        }
        .file-name {
            font-weight: 600;
            word-break: break-all;
        }
        .size-row {
            display: flex;
            flex-wrap: wrap;
            align-items: center;
            gap: 1.5rem;
            background: white;
            padding: 0.8rem 1rem;
            border-radius: var(--radius-md);
            border: 1px solid var(--border);
        }
        .size-item {
            display: flex;
            flex-direction: column;
        }
        .size-label {
            font-size: 0.75rem;
            text-transform: uppercase;
            letter-spacing: 0.5px;
            color: var(--text-secondary);
        }
        .size-value {
            font-weight: 700;
            font-size: 1.1rem;
        }
        .savings-badge {
            margin-left: auto;
            background: #dbeafe;
            color: #1e40af;
            padding: 0.3rem 1rem;
            border-radius: 50px;
            font-size: 0.8rem;
            font-weight: 600;
            white-space: nowrap;
        }

        /* ----- Controls (Quality Slider, Buttons) ----- */
        .controls {
            display: flex;
            flex-wrap: wrap;
            align-items: center;
            gap: 1.5rem;
            background: var(--surface);
            padding: 1.2rem 1.5rem;
            border-radius: var(--radius-md);
            border: 1px solid var(--border);
        }
        .quality-slider {
            flex: 2;
            min-width: 180px;
            display: flex;
            flex-direction: column;
            gap: 0.3rem;
        }
        .quality-slider label {
            font-weight: 600;
            font-size: 0.9rem;
            display: flex;
            justify-content: space-between;
        }
        input[type="range"] {
            width: 100%;
            accent-color: var(--primary);
            height: 6px;
        }
        .btn {
            display: inline-flex;
            align-items: center;
            justify-content: center;
            gap: 0.4rem;
            font-weight: 600;
            font-size: 0.95rem;
            padding: 0.7rem 1.6rem;
            border-radius: 40px;
            border: none;
            cursor: pointer;
            transition: var(--transition);
            white-space: nowrap;
            font-family: inherit;
        }
        .btn-primary {
            background: var(--primary);
            color: white;
            box-shadow: 0 4px 12px rgba(37, 99, 235, 0.3);
        }
        .btn-primary:hover:not(:disabled) {
            background: var(--primary-hover);
            transform: translateY(-1px);
            box-shadow: 0 8px 18px rgba(37, 99, 235, 0.25);
        }
        .btn-outline {
            background: transparent;
            border: 1px solid var(--border);
            color: var(--text);
        }
        .btn-outline:hover:not(:disabled) {
            background: var(--surface);
            border-color: var(--primary);
        }
        .btn:disabled {
            opacity: 0.5;
            cursor: not-allowed;
            pointer-events: none;
        }

        /* ----- Progress Bar ----- */
        .progress-container {
            height: 8px;
            background: #e9eef2;
            border-radius: 50px;
            overflow: hidden;
            width: 100%;
            display: none;
        }
        .progress-bar {
            height: 100%;
            width: 0%;
            background: var(--primary);
            border-radius: 50px;
            transition: width 0.1s ease;
        }
        .progress-text {
            font-size: 0.8rem;
            color: var(--text-secondary);
            margin-top: 0.3rem;
        }

        /* ----- Responsive ----- */
        @media (max-width: 600px) {
            .compressor-card { padding: 1.5rem; }
            .preview-section { flex-direction: column; align-items: stretch; }
            .preview-box { max-width: 100%; }
            .size-row { flex-direction: column; align-items: flex-start; }
            .savings-badge { margin-left: 0; }
            .controls { flex-direction: column; align-items: stretch; }
        }
    </style>
</head>
<body>
    <!-- Header with back link to homepage -->
    <header class="tool-header">
        <div class="header-container">
            <a href="index.html" class="back-link">
                <i class="fa-solid fa-arrow-left"></i> Back to Tools
            </a>
            <a href="index.html" class="site-logo">
                <i class="fa-solid fa-toolbox"></i> ToolCraft
            </a>
        </div>
    </header>

    <!-- Main Compressor -->
    <main class="main-container">
        <div class="compressor-card">
            <h1 style="font-size:1.8rem; font-weight:800; display:flex; align-items:center; gap:0.5rem;">
                <i class="fa-solid fa-compress" style="color:var(--primary);"></i> Image Compressor
            </h1>

            <!-- Upload Area -->
            <div class="upload-area" id="dropZone">
                <span class="upload-icon">📁</span>
                <div class="upload-text">Drag & drop your image here</div>
                <div class="upload-hint">or click to browse – JPEG, PNG, WebP</div>
                <input type="file" id="fileInput" accept="image/*" aria-label="Choose image file">
            </div>

            <!-- Preview & File Details (hidden initially) -->
            <div class="preview-section" id="previewSection" style="display: none;">
                <div class="preview-box" id="beforeBox">
                    <span class="preview-label">Before</span>
                    <img id="previewBefore" src="#" alt="Original">
                </div>
                <div class="preview-box" id="afterBox">
                    <span class="preview-label">After</span>
                    <img id="previewAfter" src="#" alt="Compressed">
                </div>
                <div class="image-details">
                    <div class="file-name" id="fileName">—</div>
                    <div class="size-row">
                        <div class="size-item">
                            <span class="size-label">Original Size</span>
                            <span class="size-value" id="originalSize">—</span>
                        </div>
                        <div class="size-item">
                            <span class="size-label">Compressed Size</span>
                            <span class="size-value" id="compressedSize">—</span>
                        </div>
                        <div class="savings-badge" id="savingsBadge" style="display: none;">0% saved</div>
                    </div>
                </div>
            </div>

            <!-- Controls -->
            <div class="controls">
                <div class="quality-slider">
                    <label for="qualityRange">
                        <span>Quality</span>
                        <span id="qualityValue">80%</span>
                    </label>
                    <input type="range" id="qualityRange" min="10" max="100" value="80" step="1">
                </div>
                <button class="btn btn-primary" id="compressBtn" disabled>
                    <i class="fa-solid fa-bolt"></i> Compress Image
                </button>
                <button class="btn btn-outline" id="downloadBtn" disabled>
                    <i class="fa-solid fa-download"></i> Download
                </button>
            </div>

            <!-- Progress -->
            <div>
                <div class="progress-container" id="progressContainer">
                    <div class="progress-bar" id="progressBar"></div>
                </div>
                <div class="progress-text" id="progressText"></div>
            </div>
        </div>
    </main>

    <script>
        (function() {
            // DOM Elements
            const dropZone = document.getElementById('dropZone');
            const fileInput = document.getElementById('fileInput');
            const previewSection = document.getElementById('previewSection');
            const previewBefore = document.getElementById('previewBefore');
            const previewAfter = document.getElementById('previewAfter');
            const fileNameElem = document.getElementById('fileName');
            const originalSizeElem = document.getElementById('originalSize');
            const compressedSizeElem = document.getElementById('compressedSize');
            const savingsBadge = document.getElementById('savingsBadge');
            const qualityRange = document.getElementById('qualityRange');
            const qualityValue = document.getElementById('qualityValue');
            const compressBtn = document.getElementById('compressBtn');
            const downloadBtn = document.getElementById('downloadBtn');
            const progressContainer = document.getElementById('progressContainer');
            const progressBar = document.getElementById('progressBar');
            const progressText = document.getElementById('progressText');

            // State
            let originalFile = null;
            let compressedBlob = null;
            let originalObjectUrl = null;

            // Utility
            function formatBytes(bytes, decimals = 2) {
                if (bytes === 0) return '0 Bytes';
                const k = 1024;
                const dm = decimals < 0 ? 0 : decimals;
                const sizes = ['Bytes', 'KB', 'MB', 'GB'];
                const i = Math.floor(Math.log(bytes) / Math.log(k));
                return parseFloat((bytes / Math.pow(k, i)).toFixed(dm)) + ' ' + sizes[i];
            }

            // Reset UI
            function resetUI() {
                previewSection.style.display = 'none';
                previewBefore.src = '#';
                previewAfter.src = '#';
                fileNameElem.textContent = '—';
                originalSizeElem.textContent = '—';
                compressedSizeElem.textContent = '—';
                savingsBadge.style.display = 'none';
                compressBtn.disabled = true;
                downloadBtn.disabled = true;
                compressedBlob = null;
                if (originalObjectUrl) {
                    URL.revokeObjectURL(originalObjectUrl);
                    originalObjectUrl = null;
                }
                progressContainer.style.display = 'none';
                progressBar.style.width = '0%';
                progressText.textContent = '';
                originalFile = null;
            }

            // Handle file selection
            function handleFile(file) {
                if (!file || !file.type.startsWith('image/')) {
                    alert('Please select a valid image file.');
                    return;
                }
                resetUI();
                originalFile = file;

                // Show file info
                originalSizeElem.textContent = formatBytes(file.size);
                fileNameElem.textContent = file.name;

                // Preview original
                originalObjectUrl = URL.createObjectURL(file);
                previewBefore.src = originalObjectUrl;
                previewSection.style.display = 'flex';
                compressBtn.disabled = false;

                // Clear after preview
                previewAfter.src = '#';
                compressedSizeElem.textContent = '—';
                savingsBadge.style.display = 'none';
                downloadBtn.disabled = true;
            }

            // Drag & Drop events
            ['dragenter', 'dragover', 'dragleave', 'drop'].forEach(eventName => {
                dropZone.addEventListener(eventName, (e) => e.preventDefault());
                document.body.addEventListener(eventName, (e) => e.preventDefault());
            });
            ['dragenter', 'dragover'].forEach(eventName => {
                dropZone.addEventListener(eventName, () => dropZone.classList.add('dragover'));
            });
            ['dragleave', 'drop'].forEach(eventName => {
                dropZone.addEventListener(eventName, () => dropZone.classList.remove('dragover'));
            });
            dropZone.addEventListener('drop', (e) => {
                const files = e.dataTransfer.files;
                if (files.length) handleFile(files[0]);
            });
            fileInput.addEventListener('change', (e) => {
                if (e.target.files.length) handleFile(e.target.files[0]);
            });
            dropZone.addEventListener('click', () => fileInput.click());

            // Quality slider
            qualityRange.addEventListener('input', () => {
                qualityValue.textContent = qualityRange.value + '%';
            });

            // Compression with progress simulation
            compressBtn.addEventListener('click', () => {
                if (!originalFile) return;
                compressBtn.disabled = true;
                downloadBtn.disabled = true;

                progressContainer.style.display = 'block';
                progressBar.style.width = '0%';
                progressText.textContent = 'Compressing...';

                let width = 0;
                const interval = setInterval(() => {
                    width += Math.random() * 15 + 5;
                    if (width >= 90) {
                        width = 90;
                        clearInterval(interval);
                    }
                    progressBar.style.width = width + '%';
                }, 60);

                const img = new Image();
                img.src = originalObjectUrl;
                img.onload = () => {
                    clearInterval(interval);
                    progressBar.style.width = '100%';
                    progressText.textContent = 'Finalizing...';

                    const canvas = document.createElement('canvas');
                    canvas.width = img.naturalWidth;
                    canvas.height = img.naturalHeight;
                    const ctx = canvas.getContext('2d');
                    ctx.drawImage(img, 0, 0);

                    const quality = qualityRange.value / 100;
                    canvas.toBlob((blob) => {
                        if (!blob) {
                            alert('Compression failed. Try a different image.');
                            resetUI();
                            return;
                        }
                        compressedBlob = blob;
                        const afterSize = blob.size;
                        compressedSizeElem.textContent = formatBytes(afterSize);

                        // Show compressed preview
                        const compressedUrl = URL.createObjectURL(blob);
                        previewAfter.src = compressedUrl;

                        // Savings
                        const originalSize = originalFile.size;
                        const percent = originalSize ? Math.round((1 - afterSize / originalSize) * 100) : 0;
                        if (percent > 0) {
                            savingsBadge.style.display = 'inline-block';
                            savingsBadge.textContent = percent + '% saved';
                        } else {
                            savingsBadge.style.display = 'none';
                        }

                        downloadBtn.disabled = false;
                        compressBtn.disabled = false;
                        progressText.textContent = 'Compression complete!';
                        setTimeout(() => {
                            progressContainer.style.display = 'none';
                        }, 1500);
                    }, 'image/jpeg', quality);
                };
                img.onerror = () => {
                    clearInterval(interval);
                    alert('Invalid image file.');
                    resetUI();
                };
            });

            // Download
            downloadBtn.addEventListener('click', () => {
                if (!compressedBlob) return;
                const url = URL.createObjectURL(compressedBlob);
                const a = document.createElement('a');
                const originalName = originalFile ? originalFile.name.replace(/\.[^/.]+$/, '') : 'compressed';
                a.href = url;
                a.download = `${originalName}_compressed.jpg`;
                document.body.appendChild(a);
                a.click();
                document.body.removeChild(a);
                URL.revokeObjectURL(url);
            });

            // Init
            resetUI();
            qualityValue.textContent = qualityRange.value + '%';
        })();
    </script>
</body>
</html>
