<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Advanced Color Picker – Free Online Tool | ToolCraft</title>
    <meta name="description" content="Pick, convert, and copy colors. Supports HEX, RGB, HSL, and generates harmonious color palettes. Free and instant.">
    <meta name="keywords" content="color picker, hex to rgb, rgb to hsl, color palette generator, online color tool">
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500;600;700;800;900&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.1/css/all.min.css">
    <style>
        :root {
            --primary: #2563eb; --primary-hover: #1d4ed8; --primary-light: #dbeafe;
            --bg: #ffffff; --surface: #f8fafc; --text: #0f172a; --text-secondary: #475569;
            --border: #e2e8f0; --radius-md: 16px; --radius-lg: 22px;
            --shadow-lg: 0 16px 40px rgba(0,0,0,0.08);
            --glass-bg: rgba(255,255,255,0.65); --glass-border: rgba(255,255,255,0.5);
            --glass-blur: blur(14px); --transition: 0.25s cubic-bezier(0.2, 0.0, 0, 1.0);
        }
        * { margin: 0; padding: 0; box-sizing: border-box; }
        body { font-family: 'Inter', sans-serif; background: linear-gradient(145deg, #f9fafc 0%, #f1f5f9 100%); color: var(--text); min-height: 100vh; display: flex; flex-direction: column; }
        .tool-header { background: var(--glass-bg); backdrop-filter: var(--glass-blur); -webkit-backdrop-filter: var(--glass-blur); border-bottom: 1px solid var(--glass-border); padding: 1rem 0; position: sticky; top: 0; z-index: 100; }
        .header-container { max-width: 1150px; margin: 0 auto; padding: 0 2rem; display: flex; align-items: center; justify-content: space-between; }
        .back-link { display: inline-flex; align-items: center; gap: 0.4rem; font-weight: 600; color: var(--primary); text-decoration: none; font-size: 0.95rem; transition: gap 0.2s; }
        .back-link:hover { gap: 0.7rem; }
        .site-logo { display: flex; align-items: center; gap: 0.5rem; font-weight: 800; font-size: 1.3rem; color: var(--text); text-decoration: none; }
        .site-logo i { color: var(--primary); }
        .main-container { flex: 1; display: flex; align-items: flex-start; justify-content: center; padding: 2rem; }
        .tool-card { width: 100%; max-width: 750px; background: var(--bg); border-radius: var(--radius-lg); box-shadow: var(--shadow-lg); padding: 2.5rem; display: flex; flex-direction: column; gap: 2rem; }
        .picker-wrapper { display: flex; align-items: center; gap: 1.5rem; flex-wrap: wrap; }
        #colorInput { width: 80px; height: 80px; border: 2px solid var(--border); border-radius: var(--radius-md); cursor: pointer; padding: 5px; background: white; }
        .color-values { display: flex; flex-direction: column; gap: 0.8rem; flex: 1; }
        .value-row { display: flex; align-items: center; gap: 0.5rem; background: var(--surface); padding: 0.5rem 1rem; border-radius: 12px; border: 1px solid var(--border); }
        .value-row label { font-weight: 600; font-size: 0.8rem; color: var(--text-secondary); width: 35px; }
        .value-row input { border: none; background: transparent; font-family: 'Consolas', monospace; font-weight: 600; font-size: 0.9rem; outline: none; width: 100%; color: var(--text); }
        .copy-btn { background: none; border: none; color: var(--primary); cursor: pointer; font-size: 1rem; padding: 0.2rem; }
        .palette { display: flex; gap: 0.5rem; flex-wrap: wrap; }
        .swatch { width: 50px; height: 50px; border-radius: 12px; cursor: pointer; border: 2px solid transparent; transition: 0.2s; }
        .swatch:hover { border-color: var(--primary); transform: scale(1.1); }
    </style>
</head>
<body>
    <header class="tool-header">
        <div class="header-container">
            <a href="index.html" class="back-link"><i class="fa-solid fa-arrow-left"></i> Back to Tools</a>
            <a href="index.html" class="site-logo"><i class="fa-solid fa-toolbox"></i> ToolCraft</a>
        </div>
    </header>
    <main class="main-container">
        <div class="tool-card">
            <h1 style="font-size:1.8rem; font-weight:800;"><i class="fa-solid fa-palette" style="color:var(--primary);"></i> Advanced Color Picker</h1>
            <div class="picker-wrapper">
                <input type="color" id="colorInput" value="#2563eb">
                <div class="color-values">
                    <div class="value-row"><label>HEX</label><input type="text" id="hexValue" readonly><button class="copy-btn" data-target="hexValue"><i class="fa-solid fa-copy"></i></button></div>
                    <div class="value-row"><label>RGB</label><input type="text" id="rgbValue" readonly><button class="copy-btn" data-target="rgbValue"><i class="fa-solid fa-copy"></i></button></div>
                    <div class="value-row"><label>HSL</label><input type="text" id="hslValue" readonly><button class="copy-btn" data-target="hslValue"><i class="fa-solid fa-copy"></i></button></div>
                </div>
            </div>
            <div>
                <h3 style="margin-bottom: 0.8rem;">Generated Palette</h3>
                <div id="paletteContainer" class="palette"></div>
            </div>
        </div>
    </main>
    <script>
        const colorInput = document.getElementById('colorInput');
        const hexValue = document.getElementById('hexValue');
        const rgbValue = document.getElementById('rgbValue');
        const hslValue = document.getElementById('hslValue');
        const paletteContainer = document.getElementById('paletteContainer');

        function updateColor(hex) {
            hexValue.value = hex;
            const r = parseInt(hex.slice(1,3), 16);
            const g = parseInt(hex.slice(3,5), 16);
            const b = parseInt(hex.slice(5,7), 16);
            rgbValue.value = `rgb(${r}, ${g}, ${b})`;
            // RGB to HSL
            let rr = r/255, gg = g/255, bb = b/255;
            let max = Math.max(rr,gg,bb), min = Math.min(rr,gg,bb);
            let h, s, l = (max+min)/2;
            if(max === min) { h = s = 0; }
            else {
                let d = max-min;
                s = l > 0.5 ? d/(2-max-min) : d/(max+min);
                switch(max) {
                    case rr: h = ((gg-bb)/d + (gg<bb?6:0))/6; break;
                    case gg: h = ((bb-rr)/d + 2)/6; break;
                    case bb: h = ((rr-gg)/d + 4)/6; break;
                }
            }
            h = Math.round(h*360); s = Math.round(s*100); l = Math.round(l*100);
            hslValue.value = `hsl(${h}, ${s}%, ${l}%)`;

            // Generate palette (complementary, analogous, etc.)
            paletteContainer.innerHTML = '';
            const palettes = [
                hex,
                '#' + ((0xFFFFFF ^ parseInt(hex.slice(1),16)).toString(16).padStart(6,'0')), // complementary approx
                '#' + (parseInt(hex.slice(1),16) + 0x333333).toString(16).slice(0,6).padStart(6,'0'),
                '#' + (parseInt(hex.slice(1),16) - 0x222222).toString(16).slice(0,6).padStart(6,'0'),
                '#' + (parseInt(hex.slice(1),16) + 0x555555).toString(16).slice(0,6).padStart(6,'0')
            ];
            palettes.forEach(color => {
                const swatch = document.createElement('div');
                swatch.className = 'swatch';
                swatch.style.backgroundColor = color;
                swatch.title = color;
                swatch.addEventListener('click', () => {
                    colorInput.value = color;
                    updateColor(color);
                });
                paletteContainer.appendChild(swatch);
            });
        }

        colorInput.addEventListener('input', (e) => updateColor(e.target.value));
        // Copy buttons
        document.querySelectorAll('.copy-btn').forEach(btn => {
            btn.addEventListener('click', () => {
                const targetId = btn.dataset.target;
                const input = document.getElementById(targetId);
                navigator.clipboard.writeText(input.value);
                btn.innerHTML = '<i class="fa-solid fa-check"></i>';
                setTimeout(() => btn.innerHTML = '<i class="fa-solid fa-copy"></i>', 1500);
            });
        });
        // Initial update
        updateColor(colorInput.value);
    </script>
</body>
</html>
