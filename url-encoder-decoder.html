<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>URL Encoder / Decoder – Free Online Tool | ToolCraft</title>
    <meta name="description" content="Encode or decode URLs online. Safely handle special characters, percent-encoding, and query strings. Fast, free, and private.">
    <meta name="keywords" content="url encoder, url decoder, percent encoding, decode url, online url tool">
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500;600;700;800;900&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.1/css/all.min.css">
    <style>
        :root {
            --primary: #2563eb; --primary-hover: #1d4ed8; --primary-light: #dbeafe;
            --bg: #ffffff; --surface: #f8fafc; --text: #0f172a; --text-secondary: #475569;
            --border: #e2e8f0; --radius-md: 16px; --radius-lg: 22px;
            --shadow-lg: 0 16px 40px rgba(0,0,0,0.08);
            --glass-bg: rgba(255,255,255,0.65); --glass-border: rgba(255,255,255,0.5);
            --glass-blur: blur(14px); --transition: 0.25s cubic-bezier(0.2, 0.0, 0, 1.0);
        }
        * { margin: 0; padding: 0; box-sizing: border-box; }
        body { font-family: 'Inter', sans-serif; background: linear-gradient(145deg, #f9fafc 0%, #f1f5f9 100%); color: var(--text); min-height: 100vh; display: flex; flex-direction: column; }
        .tool-header { background: var(--glass-bg); backdrop-filter: var(--glass-blur); -webkit-backdrop-filter: var(--glass-blur); border-bottom: 1px solid var(--glass-border); padding: 1rem 0; position: sticky; top: 0; z-index: 100; }
        .header-container { max-width: 1150px; margin: 0 auto; padding: 0 2rem; display: flex; align-items: center; justify-content: space-between; }
        .back-link { display: inline-flex; align-items: center; gap: 0.4rem; font-weight: 600; color: var(--primary); text-decoration: none; font-size: 0.95rem; transition: gap 0.2s; }
        .back-link:hover { gap: 0.7rem; }
        .site-logo { display: flex; align-items: center; gap: 0.5rem; font-weight: 800; font-size: 1.3rem; color: var(--text); text-decoration: none; }
        .site-logo i { color: var(--primary); }
        .main-container { flex: 1; display: flex; align-items: flex-start; justify-content: center; padding: 2rem; }
        .tool-card { width: 100%; max-width: 850px; background: var(--bg); border-radius: var(--radius-lg); box-shadow: var(--shadow-lg); padding: 2.5rem; display: flex; flex-direction: column; gap: 2rem; }
        .input-group { display: flex; flex-direction: column; gap: 0.4rem; }
        .input-label { font-weight: 600; font-size: 0.9rem; color: var(--text-secondary); }
        textarea { width: 100%; min-height: 150px; border: 2px solid var(--border); border-radius: var(--radius-md); padding: 1rem; font-family: 'Consolas', monospace; font-size: 0.9rem; line-height: 1.5; resize: vertical; outline: none; background: var(--surface); color: var(--text); }
        textarea:focus { border-color: var(--primary); box-shadow: 0 0 0 4px rgba(37,99,235,0.06); }
        .btn-row { display: flex; flex-wrap: wrap; gap: 0.8rem; }
        .btn { display: inline-flex; align-items: center; gap: 0.5rem; font-weight: 600; font-size: 0.9rem; padding: 0.7rem 1.5rem; border-radius: 40px; border: none; cursor: pointer; transition: var(--transition); font-family: inherit; }
        .btn-primary { background: var(--primary); color: white; box-shadow: 0 4px 12px rgba(37,99,235,0.3); }
        .btn-primary:hover { background: var(--primary-hover); transform: translateY(-1px); }
        .btn-outline { background: transparent; border: 1.5px solid var(--border); color: var(--text); }
        .btn-outline:hover { background: var(--surface); border-color: var(--primary); }
        @media (max-width: 600px) { .tool-card { padding: 1.5rem; } }
    </style>
</head>
<body>
    <header class="tool-header">
        <div class="header-container">
            <a href="index.html" class="back-link"><i class="fa-solid fa-arrow-left"></i> Back to Tools</a>
            <a href="index.html" class="site-logo"><i class="fa-solid fa-toolbox"></i> ToolCraft</a>
        </div>
    </header>
    <main class="main-container">
        <div class="tool-card">
            <h1 style="font-size:1.8rem; font-weight:800;"><i class="fa-solid fa-link" style="color:var(--primary);"></i> URL Encoder / Decoder</h1>
            <div class="input-group">
                <span class="input-label">Input</span>
                <textarea id="inputText" placeholder="Enter URL or text to encode/decode..."></textarea>
            </div>
            <div class="btn-row">
                <button class="btn btn-primary" id="encodeBtn"><i class="fa-solid fa-lock"></i> Encode</button>
                <button class="btn btn-primary" id="decodeBtn"><i class="fa-solid fa-unlock"></i> Decode</button>
                <button class="btn btn-outline" id="swapBtn"><i class="fa-solid fa-arrow-right-arrow-left"></i> Swap</button>
                <button class="btn btn-outline" id="clearBtn"><i class="fa-solid fa-trash-can"></i> Clear</button>
            </div>
            <div class="input-group">
                <span class="input-label">Output</span>
                <textarea id="outputText" placeholder="Result will appear here..." readonly></textarea>
            </div>
        </div>
    </main>
    <script>
        const inputEl = document.getElementById('inputText');
        const outputEl = document.getElementById('outputText');
        document.getElementById('encodeBtn').addEventListener('click', () => {
            outputEl.value = encodeURIComponent(inputEl.value);
        });
        document.getElementById('decodeBtn').addEventListener('click', () => {
            try { outputEl.value = decodeURIComponent(inputEl.value); }
            catch(e) { outputEl.value = 'Error: Invalid encoded string'; }
        });
        document.getElementById('swapBtn').addEventListener('click', () => {
            [inputEl.value, outputEl.value] = [outputEl.value, inputEl.value];
        });
        document.getElementById('clearBtn').addEventListener('click', () => {
            inputEl.value = ''; outputEl.value = '';
        });
    </script>
</body>
</html>
