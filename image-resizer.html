<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover">
    <title>Image Resizer & Cropper – Free Online Tool | ToolCraft</title>
    <meta name="description" content="Crop and resize images online. Drag to select crop area, resize in pixels, inches or cm, lock aspect ratio, adjust DPI and download instantly.">
    <meta name="keywords" content="image cropper, image resizer, resize image in cm, inches to pixels, crop image online, free online tool">
    <meta name="author" content="ToolCraft">
    <meta name="robots" content="index, follow">

    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500;600;700;800;900&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.1/css/all.min.css">

    <style>
        :root {
            --primary: #2563eb;
            --primary-hover: #1d4ed8;
            --primary-light: #dbeafe;
            --bg: #ffffff;
            --surface: #f8fafc;
            --text: #0f172a;
            --text-secondary: #475569;
            --border: #e2e8f0;
            --radius-md: 16px;
            --radius-lg: 22px;
            --shadow-sm: 0 2px 8px rgba(0,0,0,0.05);
            --shadow-md: 0 6px 20px rgba(0,0,0,0.07);
            --shadow-lg: 0 16px 40px rgba(0,0,0,0.08);
            --glass-bg: rgba(255,255,255,0.65);
            --glass-border: rgba(255,255,255,0.5);
            --glass-blur: blur(14px);
            --transition: 0.25s cubic-bezier(0.2, 0.0, 0, 1.0);
        }

        * { margin: 0; padding: 0; box-sizing: border-box; }
        body {
            font-family: 'Inter', sans-serif;
            background: linear-gradient(145deg, #f9fafc 0%, #f1f5f9 100%);
            color: var(--text);
            min-height: 100vh;
            display: flex;
            flex-direction: column;
            -webkit-font-smoothing: antialiased;
        }

        .tool-header {
            background: var(--glass-bg);
            backdrop-filter: var(--glass-blur);
            -webkit-backdrop-filter: var(--glass-blur);
            border-bottom: 1px solid var(--glass-border);
            padding: 1rem 0;
            position: sticky;
            top: 0;
            z-index: 100;
        }
        .header-container {
            max-width: 1150px;
            margin: 0 auto;
            padding: 0 2rem;
            display: flex;
            align-items: center;
            justify-content: space-between;
        }
        .back-link {
            display: inline-flex;
            align-items: center;
            gap: 0.4rem;
            font-weight: 600;
            color: var(--primary);
            text-decoration: none;
            font-size: 0.95rem;
            transition: gap 0.2s;
        }
        .back-link:hover { gap: 0.7rem; }
        .back-link i { font-size: 0.9rem; }
        .site-logo {
            display: flex;
            align-items: center;
            gap: 0.5rem;
            font-weight: 800;
            font-size: 1.3rem;
            color: var(--text);
            text-decoration: none;
        }
        .site-logo i { color: var(--primary); }

        .main-container {
            flex: 1;
            display: flex;
            align-items: flex-start;
            justify-content: center;
            padding: 2rem;
        }
        .tool-card {
            width: 100%;
            max-width: 1000px;
            background: var(--bg);
            border-radius: var(--radius-lg);
            box-shadow: var(--shadow-lg), 0 0 0 1px rgba(0,0,0,0.02);
            padding: 2.5rem;
            display: flex;
            flex-direction: column;
            gap: 2rem;
        }

        .upload-area {
            border: 2px dashed var(--border);
            border-radius: var(--radius-md);
            padding: 2.5rem 1.5rem;
            text-align: center;
            cursor: pointer;
            background: var(--surface);
            transition: all 0.2s ease;
            position: relative;
        }
        .upload-area:hover,
        .upload-area.dragover {
            border-color: var(--primary);
            background: var(--primary-light);
            transform: translateY(-1px);
        }
        .upload-area .upload-icon { font-size: 2.8rem; color: var(--primary); margin-bottom: 0.8rem; display: block; }
        .upload-text { font-weight: 600; font-size: 1.1rem; color: var(--text); margin-bottom: 0.3rem; }
        .upload-hint { color: var(--text-secondary); font-size: 0.9rem; }
        .upload-area input[type="file"] { position: absolute; inset: 0; opacity: 0; cursor: pointer; }

        .resize-panel { display: none; flex-direction: column; gap: 1.8rem; }
        .preview-row {
            display: flex;
            flex-wrap: wrap;
            gap: 1.5rem;
            align-items: center;
        }
        .preview-box {
            flex: 1;
            min-width: 180px;
            text-align: center;
            background: var(--surface);
            border-radius: var(--radius-md);
            border: 1px solid var(--border);
            padding: 1rem;
        }
        .preview-box img {
            max-width: 100%;
            max-height: 240px;
            object-fit: contain;
            border-radius: 8px;
        }
        .preview-label { font-size: 0.8rem; font-weight: 600; color: var(--text-secondary); margin-bottom: 0.5rem; text-transform: uppercase; }

        .resize-controls {
            display: flex;
            flex-wrap: wrap;
            align-items: flex-end;
            gap: 1.5rem;
        }
        .control-group {
            display: flex;
            flex-direction: column;
            gap: 0.5rem;
        }
        .dimension-row {
            display: flex;
            align-items: center;
            gap: 0.5rem;
        }
        .dimension-field {
            display: flex;
            align-items: center;
            gap: 0.3rem;
        }
        .dimension-field label {
            font-size: 0.8rem;
            font-weight: 600;
            color: var(--text-secondary);
            text-transform: uppercase;
            white-space: nowrap;
        }
        .dimension-field input {
            width: 90px;
            padding: 0.65rem 0.5rem;
            border: 2px solid var(--border);
            border-radius: 12px;
            font-weight: 600;
            font-size: 0.95rem;
            text-align: center;
            outline: none;
            transition: border-color var(--transition);
            font-family: inherit;
        }
        .dimension-field input:focus {
            border-color: var(--primary);
            box-shadow: 0 0 0 3px rgba(37, 99, 235, 0.1);
        }
        .unit-select {
            padding: 0.65rem 0.4rem;
            border: 2px solid var(--border);
            border-radius: 12px;
            font-weight: 600;
            font-size: 0.85rem;
            background: white;
            cursor: pointer;
            outline: none;
            transition: border-color var(--transition);
            font-family: inherit;
        }
        .unit-select:focus { border-color: var(--primary); }

        .lock-btn {
            background: var(--surface);
            border: 2px solid var(--border);
            border-radius: 12px;
            width: 44px;
            height: 44px;
            display: flex;
            align-items: center;
            justify-content: center;
            cursor: pointer;
            font-size: 1.1rem;
            color: var(--text-secondary);
            transition: var(--transition);
            margin-left: 0.5rem;
        }
        .lock-btn.locked {
            background: var(--primary-light);
            border-color: var(--primary);
            color: var(--primary);
        }
        .lock-btn:hover { background: var(--primary-light); }

        .dpi-group {
            display: flex;
            align-items: center;
            gap: 0.5rem;
        }
        .dpi-group label {
            font-size: 0.8rem;
            font-weight: 600;
            color: var(--text-secondary);
            text-transform: uppercase;
        }
        .dpi-group input {
            width: 80px;
            padding: 0.65rem 0.5rem;
            border: 2px solid var(--border);
            border-radius: 12px;
            font-weight: 600;
            font-size: 0.95rem;
            text-align: center;
            outline: none;
            transition: border-color var(--transition);
            font-family: inherit;
        }
        .dpi-group input:focus { border-color: var(--primary); box-shadow: 0 0 0 3px rgba(37, 99, 235, 0.1); }

        .btn-row {
            display: flex;
            flex-wrap: wrap;
            gap: 0.8rem;
        }
        .btn {
            display: inline-flex;
            align-items: center;
            gap: 0.5rem;
            font-weight: 600;
            font-size: 0.9rem;
            padding: 0.7rem 1.5rem;
            border-radius: 40px;
            border: none;
            cursor: pointer;
            transition: var(--transition);
            white-space: nowrap;
            font-family: inherit;
        }
        .btn-primary { background: var(--primary); color: white; box-shadow: 0 4px 12px rgba(37, 99, 235, 0.3); }
        .btn-primary:hover { background: var(--primary-hover); transform: translateY(-1px); box-shadow: 0 8px 18px rgba(37, 99, 235, 0.25); }
        .btn-outline { background: transparent; border: 1.5px solid var(--border); color: var(--text); }
        .btn-outline:hover { background: var(--surface); border-color: var(--primary); color: var(--primary); }
        .btn-crop { background: #f59e0b; color: #0f172a; box-shadow: 0 4px 12px rgba(245, 158, 11, 0.3); }
        .btn-crop:hover { background: #d97706; transform: translateY(-1px); }

        .info-text { font-size: 0.85rem; color: var(--text-secondary); display: flex; gap: 1rem; flex-wrap: wrap; }

        .crop-section {
            display: none;
            flex-direction: column;
            gap: 1.5rem;
            background: var(--surface);
            border-radius: var(--radius-md);
            padding: 1.5rem;
            border: 1px solid var(--border);
        }
        .crop-container {
            position: relative;
            display: inline-block;
            max-width: 100%;
            user-select: none;
            touch-action: none;
            margin: 0 auto;
        }
        .crop-container img {
            display: block;
            max-width: 100%;
            max-height: 400px;
            border-radius: 8px;
            box-shadow: var(--shadow-sm);
        }
        .crop-selection {
            position: absolute;
            border: 2px dashed white;
            box-shadow: 0 0 0 9999px rgba(0,0,0,0.45);
            cursor: move;
            pointer-events: auto;
            z-index: 2;
        }
        .crop-handle {
            position: absolute;
            width: 12px;
            height: 12px;
            background: white;
            border: 2px solid var(--primary);
            border-radius: 4px;
            pointer-events: auto;
            z-index: 3;
        }
        .handle-nw { top: -6px; left: -6px; cursor: nw-resize; }
        .handle-ne { top: -6px; right: -6px; cursor: ne-resize; }
        .handle-se { bottom: -6px; right: -6px; cursor: se-resize; }
        .handle-sw { bottom: -6px; left: -6px; cursor: sw-resize; }
        .crop-info {
            font-size: 0.85rem;
            color: var(--text-secondary);
            text-align: center;
        }

        @media (max-width: 750px) {
            .tool-card { padding: 1.5rem; }
            .preview-row { flex-direction: column; }
            .resize-controls { flex-direction: column; align-items: stretch; }
            .dimension-row { flex-wrap: wrap; }
        }
    </style>
</head>
<body>
    <header class="tool-header">
        <div class="header-container">
            <a href="index.html" class="back-link"><i class="fa-solid fa-arrow-left"></i> Back to Tools</a>
            <a href="index.html" class="site-logo"><i class="fa-solid fa-toolbox"></i> ToolCraft</a>
        </div>
    </header>

    <main class="main-container">
        <div class="tool-card">
            <h1 style="font-size:1.8rem; font-weight:800; display:flex; align-items:center; gap:0.5rem;">
                <i class="fa-solid fa-crop" style="color:var(--primary);"></i> Image Resizer & Cropper
            </h1>

            <div class="upload-area" id="dropZone">
                <span class="upload-icon">📁</span>
                <div class="upload-text">Drag & drop your image here</div>
                <div class="upload-hint">or click to browse – JPEG, PNG, WebP</div>
                <input type="file" id="fileInput" accept="image/*" aria-label="Choose image file">
            </div>

            <div class="crop-section" id="cropSection">
                <h3 style="font-weight:700;"><i class="fa-solid fa-crop"></i> Crop Image</h3>
                <div class="crop-container" id="cropContainer">
                    <img id="cropImage" src="#" alt="Crop">
                    <div class="crop-selection" id="cropSelection">
                        <div class="crop-handle handle-nw" data-handle="nw"></div>
                        <div class="crop-handle handle-ne" data-handle="ne"></div>
                        <div class="crop-handle handle-se" data-handle="se"></div>
                        <div class="crop-handle handle-sw" data-handle="sw"></div>
                    </div>
                </div>
                <div class="crop-info" id="cropInfo">Drag inside the box to move • Drag corners to resize</div>
                <div class="btn-row">
                    <button class="btn btn-primary" id="applyCropBtn"><i class="fa-solid fa-check"></i> Apply Crop</button>
                    <button class="btn btn-outline" id="cancelCropBtn"><i class="fa-solid fa-xmark"></i> Cancel</button>
                    <button class="btn btn-outline" id="resetCropBtn"><i class="fa-solid fa-rotate-left"></i> Reset</button>
                </div>
            </div>

            <div class="resize-panel" id="resizePanel">
                <div class="preview-row">
                    <div class="preview-box">
                        <div class="preview-label">Original (after crop)</div>
                        <img id="previewOriginal" src="#" alt="Original">
                        <div id="originalInfo" class="info-text" style="margin-top:0.5rem;"></div>
                    </div>
                    <div class="preview-box">
                        <div class="preview-label">Resized Preview</div>
                        <img id="previewResized" src="#" alt="Resized">
                        <div id="resizedInfo" class="info-text" style="margin-top:0.5rem;"></div>
                    </div>
                </div>

                <div class="resize-controls">
                    <div class="control-group">
                        <label style="font-size:0.8rem; font-weight:600; color:var(--text-secondary);">Dimensions</label>
                        <div class="dimension-row">
                            <div class="dimension-field">
                                <label>W</label>
                                <input type="number" id="widthInput" min="0.01" step="any" value="800">
                                <select class="unit-select" id="widthUnit">
                                    <option value="px">px</option>
                                    <option value="in">in</option>
                                    <option value="cm">cm</option>
                                </select>
                            </div>
                            <button class="lock-btn locked" id="lockBtn" title="Lock aspect ratio">
                                <i class="fa-solid fa-link"></i>
                            </button>
                            <div class="dimension-field">
                                <label>H</label>
                                <input type="number" id="heightInput" min="0.01" step="any" value="600">
                                <select class="unit-select" id="heightUnit">
                                    <option value="px">px</option>
                                    <option value="in">in</option>
                                    <option value="cm">cm</option>
                                </select>
                            </div>
                        </div>
                    </div>

                    <div class="dpi-group">
                        <label for="dpiInput">DPI</label>
                        <input type="number" id="dpiInput" value="96" min="1" step="any">
                    </div>

                    <button class="btn btn-outline" id="resetSizeBtn">
                        <i class="fa-solid fa-rotate-left"></i> Original Size
                    </button>
                    <button class="btn btn-crop" id="cropBtn">
                        <i class="fa-solid fa-crop"></i> Crop Image
                    </button>
                </div>

                <div class="btn-row">
                    <button class="btn btn-primary" id="downloadBtn"><i class="fa-solid fa-download"></i> Download Resized</button>
                    <button class="btn btn-outline" id="newImageBtn"><i class="fa-solid fa-upload"></i> New Image</button>
                </div>
            </div>
        </div>
    </main>

    <script>
        (function() {
            // DOM Elements
            const dropZone = document.getElementById('dropZone');
            const fileInput = document.getElementById('fileInput');
            const resizePanel = document.getElementById('resizePanel');
            const cropSection = document.getElementById('cropSection');
            const cropContainer = document.getElementById('cropContainer');
            const cropImage = document.getElementById('cropImage');
            const cropSelection = document.getElementById('cropSelection');
            const cropInfo = document.getElementById('cropInfo');
            const applyCropBtn = document.getElementById('applyCropBtn');
            const cancelCropBtn = document.getElementById('cancelCropBtn');
            const resetCropBtn = document.getElementById('resetCropBtn');
            const previewOriginal = document.getElementById('previewOriginal');
            const previewResized = document.getElementById('previewResized');
            const originalInfo = document.getElementById('originalInfo');
            const resizedInfo = document.getElementById('resizedInfo');
            const widthInput = document.getElementById('widthInput');
            const heightInput = document.getElementById('heightInput');
            const widthUnit = document.getElementById('widthUnit');
            const heightUnit = document.getElementById('heightUnit');
            const lockBtn = document.getElementById('lockBtn');
            const dpiInput = document.getElementById('dpiInput');
            const resetSizeBtn = document.getElementById('resetSizeBtn');
            const cropBtn = document.getElementById('cropBtn');
            const downloadBtn = document.getElementById('downloadBtn');
            const newImageBtn = document.getElementById('newImageBtn');

            let originalImage = null;
            let originalFile = null;
            let aspectRatioLocked = true;
            let originalWidth = 0;
            let originalHeight = 0;
            let targetPixelWidth = 800;
            let targetPixelHeight = 600;

            // Track which field is currently being edited by the user
            let editingField = null; // 'width' or 'height'

            // Crop state
            let isCropping = false;
            let cropStartX, cropStartY, cropLeft, cropTop;
            let dragging = false;
            let resizing = false;
            let activeHandle = null;
            let initialCropRect = {};

            // --- Conversion helpers ---
            function getDPI() {
                const dpi = parseFloat(dpiInput.value);
                return (isNaN(dpi) || dpi <= 0) ? 96 : dpi;
            }
            function pixelsToUnit(pixels, unit) {
                const dpi = getDPI();
                if (unit === 'px') return pixels;
                if (unit === 'in') return pixels / dpi;
                if (unit === 'cm') return (pixels / dpi) * 2.54;
                return pixels;
            }
            function unitToPixels(value, unit) {
                const dpi = getDPI();
                if (unit === 'px') return value;
                if (unit === 'in') return value * dpi;
                if (unit === 'cm') return (value / 2.54) * dpi;
                return value;
            }

            // Update only the non-editing field programmatically
            function updateDisplayFields() {
                if (editingField !== 'width') {
                    widthInput.value = parseFloat(pixelsToUnit(targetPixelWidth, widthUnit.value).toFixed(2));
                }
                if (editingField !== 'height') {
                    heightInput.value = parseFloat(pixelsToUnit(targetPixelHeight, heightUnit.value).toFixed(2));
                }
            }

            // Resize logic with aspect ratio
            function applyAspectRatioFromWidth(newPixelWidth) {
                if (aspectRatioLocked && originalWidth && originalHeight) {
                    const ratio = originalHeight / originalWidth;
                    targetPixelWidth = Math.max(1, newPixelWidth);
                    targetPixelHeight = Math.max(1, Math.round(targetPixelWidth * ratio));
                } else {
                    targetPixelWidth = Math.max(1, newPixelWidth);
                }
                updateDisplayFields();
                updateResizePreview();
            }

            function applyAspectRatioFromHeight(newPixelHeight) {
                if (aspectRatioLocked && originalWidth && originalHeight) {
                    const ratio = originalWidth / originalHeight;
                    targetPixelHeight = Math.max(1, newPixelHeight);
                    targetPixelWidth = Math.max(1, Math.round(targetPixelHeight * ratio));
                } else {
                    targetPixelHeight = Math.max(1, newPixelHeight);
                }
                updateDisplayFields();
                updateResizePreview();
            }

            // Input event handlers
            widthInput.addEventListener('input', () => {
                editingField = 'width';
                const raw = parseFloat(widthInput.value);
                if (isNaN(raw) || raw <= 0) {
                    editingField = null;
                    return;
                }
                applyAspectRatioFromWidth(unitToPixels(raw, widthUnit.value));
                editingField = null;
            });

            heightInput.addEventListener('input', () => {
                editingField = 'height';
                const raw = parseFloat(heightInput.value);
                if (isNaN(raw) || raw <= 0) {
                    editingField = null;
                    return;
                }
                applyAspectRatioFromHeight(unitToPixels(raw, heightUnit.value));
                editingField = null;
            });

            // When user finishes editing, format the field nicely
            widthInput.addEventListener('blur', () => {
                widthInput.value = parseFloat(pixelsToUnit(targetPixelWidth, widthUnit.value).toFixed(2));
            });
            heightInput.addEventListener('blur', () => {
                heightInput.value = parseFloat(pixelsToUnit(targetPixelHeight, heightUnit.value).toFixed(2));
            });

            widthUnit.addEventListener('change', () => {
                widthInput.value = parseFloat(pixelsToUnit(targetPixelWidth, widthUnit.value).toFixed(2));
            });
            heightUnit.addEventListener('change', () => {
                heightInput.value = parseFloat(pixelsToUnit(targetPixelHeight, heightUnit.value).toFixed(2));
            });

            dpiInput.addEventListener('input', updateDisplayFields);

            lockBtn.addEventListener('click', () => {
                aspectRatioLocked = !aspectRatioLocked;
                lockBtn.classList.toggle('locked', aspectRatioLocked);
                lockBtn.querySelector('i').className = aspectRatioLocked ? 'fa-solid fa-link' : 'fa-solid fa-link-slash';
                if (aspectRatioLocked && originalWidth && originalHeight) {
                    applyAspectRatioFromWidth(targetPixelWidth);
                }
            });

            resetSizeBtn.addEventListener('click', () => {
                if (!originalImage) return;
                targetPixelWidth = originalWidth;
                targetPixelHeight = originalHeight;
                widthUnit.value = 'px'; heightUnit.value = 'px';
                updateDisplayFields();
                updateResizePreview();
            });

            function updateResizePreview() {
                if (!originalImage) return;
                const w = Math.round(targetPixelWidth);
                const h = Math.round(targetPixelHeight);
                const canvas = document.createElement('canvas');
                canvas.width = w; canvas.height = h;
                const ctx = canvas.getContext('2d');
                ctx.drawImage(originalImage, 0, 0, w, h);
                previewResized.src = canvas.toDataURL('image/png');
                const dpi = getDPI();
                const inchesW = (w / dpi).toFixed(2), inchesH = (h / dpi).toFixed(2);
                const cmW = (inchesW * 2.54).toFixed(2), cmH = (inchesH * 2.54).toFixed(2);
                resizedInfo.innerHTML = `${w} × ${h} px<br>${inchesW}" × ${inchesH}"<br>${cmW} cm × ${cmH} cm`;
            }

            // --- Crop functions ---
            function initCropUI() {
                if (!originalImage) return;
                cropImage.src = originalImage.src;
                cropSection.style.display = 'flex';
                resizePanel.style.display = 'none';
                cropImage.onload = () => {
                    const imgRect = cropImage.getBoundingClientRect();
                    cropSelection.style.left = '0px';
                    cropSelection.style.top = '0px';
                    cropSelection.style.width = imgRect.width + 'px';
                    cropSelection.style.height = imgRect.height + 'px';
                    updateCropInfo();
                };
                if (cropImage.complete) cropImage.onload();
            }

            function getCropRect() {
                const imgRect = cropImage.getBoundingClientRect();
                const selRect = cropSelection.getBoundingClientRect();
                const natW = originalImage.naturalWidth;
                const natH = originalImage.naturalHeight;
                const scaleX = natW / imgRect.width;
                const scaleY = natH / imgRect.height;
                const left = (selRect.left - imgRect.left) * scaleX;
                const top = (selRect.top - imgRect.top) * scaleY;
                const width = selRect.width * scaleX;
                const height = selRect.height * scaleY;
                return { left: Math.round(left), top: Math.round(top), width: Math.round(width), height: Math.round(height) };
            }

            function applyCrop() {
                const rect = getCropRect();
                if (rect.width <= 0 || rect.height <= 0) return;
                const canvas = document.createElement('canvas');
                canvas.width = rect.width;
                canvas.height = rect.height;
                const ctx = canvas.getContext('2d');
                ctx.drawImage(originalImage, rect.left, rect.top, rect.width, rect.height, 0, 0, rect.width, rect.height);
                const dataUrl = canvas.toDataURL('image/png');
                const newImg = new Image();
                newImg.onload = () => {
                    originalImage = newImg;
                    originalWidth = rect.width;
                    originalHeight = rect.height;
                    targetPixelWidth = originalWidth;
                    targetPixelHeight = originalHeight;
                    widthUnit.value = 'px'; heightUnit.value = 'px';
                    updateDisplayFields();
                    previewOriginal.src = dataUrl;
                    originalInfo.innerHTML = `${originalWidth} × ${originalHeight} px`;
                    updateResizePreview();
                    cropSection.style.display = 'none';
                    resizePanel.style.display = 'flex';
                    isCropping = false;
                };
                newImg.src = dataUrl;
            }

            function cancelCrop() {
                cropSection.style.display = 'none';
                resizePanel.style.display = 'flex';
                isCropping = false;
            }

            function resetCropSelection() {
                if (!originalImage) return;
                const imgRect = cropImage.getBoundingClientRect();
                cropSelection.style.left = '0px';
                cropSelection.style.top = '0px';
                cropSelection.style.width = imgRect.width + 'px';
                cropSelection.style.height = imgRect.height + 'px';
                updateCropInfo();
            }

            cropBtn.addEventListener('click', () => {
                if (!originalImage) return;
                initCropUI();
                isCropping = true;
            });
            applyCropBtn.addEventListener('click', applyCrop);
            cancelCropBtn.addEventListener('click', cancelCrop);
            resetCropBtn.addEventListener('click', resetCropSelection);

            // --- Crop interaction (drag and resize) ---
            function startDrag(e) {
                if (!isCropping) return;
                e.preventDefault();
                const clientX = e.touches ? e.touches[0].clientX : e.clientX;
                const clientY = e.touches ? e.touches[0].clientY : e.clientY;
                dragging = true;
                cropStartX = clientX;
                cropStartY = clientY;
                const selRect = cropSelection.getBoundingClientRect();
                cropLeft = selRect.left;
                cropTop = selRect.top;
                document.addEventListener('mousemove', onDrag);
                document.addEventListener('mouseup', stopDrag);
                document.addEventListener('touchmove', onDrag, {passive: false});
                document.addEventListener('touchend', stopDrag);
            }

            function onDrag(e) {
                if (!dragging) return;
                e.preventDefault();
                const clientX = e.touches ? e.touches[0].clientX : e.clientX;
                const clientY = e.touches ? e.touches[0].clientY : e.clientY;
                const dx = clientX - cropStartX;
                const dy = clientY - cropStartY;
                const containerRect = cropContainer.getBoundingClientRect();
                const imgRect = cropImage.getBoundingClientRect();
                const maxLeft = imgRect.right - cropSelection.offsetWidth;
                const maxTop = imgRect.bottom - cropSelection.offsetHeight;
                const newLeft = Math.min(Math.max(cropLeft + dx - containerRect.left, imgRect.left - containerRect.left), maxLeft - containerRect.left);
                const newTop = Math.min(Math.max(cropTop + dy - containerRect.top, imgRect.top - containerRect.top), maxTop - containerRect.top);
                cropSelection.style.left = newLeft + 'px';
                cropSelection.style.top = newTop + 'px';
                updateCropInfo();
            }

            function stopDrag() {
                dragging = false;
                document.removeEventListener('mousemove', onDrag);
                document.removeEventListener('mouseup', stopDrag);
                document.removeEventListener('touchmove', onDrag);
                document.removeEventListener('touchend', stopDrag);
            }

            function startResize(e, handle) {
                if (!isCropping) return;
                e.stopPropagation();
                e.preventDefault();
                resizing = true;
                activeHandle = handle;
                const clientX = e.touches ? e.touches[0].clientX : e.clientX;
                const clientY = e.touches ? e.touches[0].clientY : e.clientY;
                cropStartX = clientX;
                cropStartY = clientY;
                const selRect = cropSelection.getBoundingClientRect();
                initialCropRect = { left: selRect.left, top: selRect.top, width: selRect.width, height: selRect.height };
                document.addEventListener('mousemove', onResize);
                document.addEventListener('mouseup', stopResize);
                document.addEventListener('touchmove', onResize, {passive: false});
                document.addEventListener('touchend', stopResize);
            }

            function onResize(e) {
                if (!resizing) return;
                e.preventDefault();
                const clientX = e.touches ? e.touches[0].clientX : e.clientX;
                const clientY = e.touches ? e.touches[0].clientY : e.clientY;
                const dx = clientX - cropStartX;
                const dy = clientY - cropStartY;
                const imgRect = cropImage.getBoundingClientRect();
                let newLeft = initialCropRect.left, newTop = initialCropRect.top;
                let newWidth = initialCropRect.width, newHeight = initialCropRect.height;
                switch(activeHandle) {
                    case 'nw':
                        newLeft = Math.min(initialCropRect.left + dx, initialCropRect.left + initialCropRect.width - 20);
                        newTop = Math.min(initialCropRect.top + dy, initialCropRect.top + initialCropRect.height - 20);
                        newWidth = initialCropRect.width - (newLeft - initialCropRect.left);
                        newHeight = initialCropRect.height - (newTop - initialCropRect.top);
                        break;
                    case 'ne':
                        newTop = Math.min(initialCropRect.top + dy, initialCropRect.top + initialCropRect.height - 20);
                        newWidth = Math.max(20, initialCropRect.width + dx);
                        newHeight = initialCropRect.height - (newTop - initialCropRect.top);
                        break;
                    case 'se':
                        newWidth = Math.max(20, initialCropRect.width + dx);
                        newHeight = Math.max(20, initialCropRect.height + dy);
                        break;
                    case 'sw':
                        newLeft = Math.min(initialCropRect.left + dx, initialCropRect.left + initialCropRect.width - 20);
                        newWidth = initialCropRect.width - (newLeft - initialCropRect.left);
                        newHeight = Math.max(20, initialCropRect.height + dy);
                        break;
                }
                newLeft = Math.max(imgRect.left, newLeft);
                newTop = Math.max(imgRect.top, newTop);
                if (newLeft + newWidth > imgRect.right) newWidth = imgRect.right - newLeft;
                if (newTop + newHeight > imgRect.bottom) newHeight = imgRect.bottom - newTop;
                cropSelection.style.left = (newLeft - cropContainer.getBoundingClientRect().left) + 'px';
                cropSelection.style.top = (newTop - cropContainer.getBoundingClientRect().top) + 'px';
                cropSelection.style.width = newWidth + 'px';
                cropSelection.style.height = newHeight + 'px';
                updateCropInfo();
            }

            function stopResize() {
                resizing = false;
                activeHandle = null;
                document.removeEventListener('mousemove', onResize);
                document.removeEventListener('mouseup', stopResize);
                document.removeEventListener('touchmove', onResize);
                document.removeEventListener('touchend', stopResize);
            }

            function updateCropInfo() {
                const rect = getCropRect();
                cropInfo.textContent = `Selected: ${rect.width} × ${rect.height} px`;
            }

            cropSelection.addEventListener('mousedown', startDrag);
            cropSelection.addEventListener('touchstart', startDrag, {passive: false});
            document.querySelectorAll('.crop-handle').forEach(handle => {
                handle.addEventListener('mousedown', (e) => startResize(e, handle.dataset.handle));
                handle.addEventListener('touchstart', (e) => startResize(e, handle.dataset.handle), {passive: false});
            });

            // --- Image loading ---
            function loadImage(file) {
                if (!file || !file.type.startsWith('image/')) {
                    alert('Please select a valid image file.');
                    return;
                }
                originalFile = file;
                const reader = new FileReader();
                reader.onload = (e) => {
                    const img = new Image();
                    img.onload = () => {
                        originalImage = img;
                        originalWidth = img.naturalWidth;
                        originalHeight = img.naturalHeight;
                        previewOriginal.src = e.target.result;
                        originalInfo.innerHTML = `${originalWidth} × ${originalHeight} px (${formatBytes(file.size)})`;
                        targetPixelWidth = originalWidth;
                        targetPixelHeight = originalHeight;
                        widthUnit.value = 'px'; heightUnit.value = 'px';
                        aspectRatioLocked = true;
                        lockBtn.classList.add('locked');
                        lockBtn.querySelector('i').className = 'fa-solid fa-link';
                        updateDisplayFields();
                        dropZone.style.display = 'none';
                        resizePanel.style.display = 'flex';
                        cropSection.style.display = 'none';
                        isCropping = false;
                        updateResizePreview();
                    };
                    img.src = e.target.result;
                };
                reader.readAsDataURL(file);
            }

            function formatBytes(bytes) {
                if (bytes === 0) return '0 Bytes';
                const k = 1024;
                const sizes = ['Bytes', 'KB', 'MB', 'GB'];
                const i = Math.floor(Math.log(bytes) / Math.log(k));
                return parseFloat((bytes / Math.pow(k, i)).toFixed(2)) + ' ' + sizes[i];
            }

            function resetAll() {
                originalImage = null;
                originalFile = null;
                dropZone.style.display = '';
                resizePanel.style.display = 'none';
                cropSection.style.display = 'none';
                previewOriginal.src = '#';
                previewResized.src = '#';
                fileInput.value = '';
            }

            downloadBtn.addEventListener('click', () => {
                if (!originalImage) return;
                const w = Math.round(targetPixelWidth);
                const h = Math.round(targetPixelHeight);
                const canvas = document.createElement('canvas');
                canvas.width = w; canvas.height = h;
                const ctx = canvas.getContext('2d');
                ctx.drawImage(originalImage, 0, 0, w, h);
                canvas.toBlob((blob) => {
                    const url = URL.createObjectURL(blob);
                    const a = document.createElement('a');
                    const baseName = originalFile ? originalFile.name.replace(/\.[^/.]+$/, '') : 'resized';
                    a.href = url;
                    a.download = `${baseName}_${w}x${h}.png`;
                    document.body.appendChild(a);
                    a.click();
                    document.body.removeChild(a);
                    URL.revokeObjectURL(url);
                }, 'image/png');
            });

            newImageBtn.addEventListener('click', resetAll);

            // Drag & Drop
            ['dragenter', 'dragover', 'dragleave', 'drop'].forEach(eventName => {
                dropZone.addEventListener(eventName, (e) => e.preventDefault());
                document.body.addEventListener(eventName, (e) => e.preventDefault());
            });
            ['dragenter', 'dragover'].forEach(eventName => {
                dropZone.addEventListener(eventName, () => dropZone.classList.add('dragover'));
            });
            ['dragleave', 'drop'].forEach(eventName => {
                dropZone.addEventListener(eventName, () => dropZone.classList.remove('dragover'));
            });
            dropZone.addEventListener('drop', (e) => {
                const files = e.dataTransfer.files;
                if (files.length) loadImage(files[0]);
            });
            fileInput.addEventListener('change', (e) => {
                if (e.target.files.length) loadImage(e.target.files[0]);
            });
            dropZone.addEventListener('click', () => fileInput.click());

            lockBtn.classList.add('locked');
            aspectRatioLocked = true;
        })();
    </script>
</body>
</html>
